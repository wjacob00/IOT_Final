# docker-compose.yml
# intiial version
# whenever I run docker compose it always notes that specifying the version is obsolete
# ./provisioning:/etc/grafana/provisioning or ./provisioning:/etc/grafana/provisioning/dashboards
version: "3"

services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    restart: unless-stopped
