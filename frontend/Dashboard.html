<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Sensor Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at center, #101010, #050505);
      color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid #39ff14;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
      text-align: center;
    }

    h1 {
      color: #39ff14;
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
    }

    #clock {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #ddd;
      margin-top: 8px;
    }

    .panel-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      padding: 0 20px;
    }

    iframe {
      flex: 1 1 450px;
      max-width: 550px;
      width: 100%;
      height: 300px;
      border: 2px solid #39ff14;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
      background: #111;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    iframe:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.6);
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      padding: 0 15px;
    }

    @media (max-width: 700px) {
      .panel-container {
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 0 5vw;
        gap: 15px;
      }

      iframe {
        width: 100%;
        height: 250px;
        border-width: 1.5px;
      }

      header {
        padding: 12px;
      }

      footer {
        font-size: 0.8rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>IoT Sensor Dashboard</h1>
    <div id="clock">--:--:--</div>
  </header>

  <div class="panel-container">
    <!-- PS2 Temperature Time Series -->
    <!--<iframe src="http://10.183.244.87:3000/d-solo/bf3y0i9dtghz4e/temp?orgId=1&from=now-5m&to=now&timezone=browser&refresh=5s&panelId=2&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe> -->

    <iframe src="http://10.183.244.90:3000/d-solo/advwps6/new-dashboard?orgId=1&from=now-5m&to=now&timezone=browser&refresh=5s&panelId=panel-1&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe>

    <!-- PS2 Humidity Time Series -->
    <!--<iframe src="http://10.183.244.87:3000/d-solo/df3y0kbox7t34a/humid?orgId=1&from=now-5m&to=now&timezone=browser&refresh=5s&panelId=3&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe> -->

   <iframe src="http://10.183.244.90:3000/d-solo/advwps6/new-dashboard?orgId=1&from=now-5m&to=now&timezone=browser&refresh=5s&panelId=panel-2&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe>

    <!-- CPU Temperature Time Series -->
    <iframe src="http://10.183.244.90:3000/d-solo/advwps6/new-dashboard?orgId=1&from=now-5m&to=now&timezone=browser&refresh=5s&panelId=panel-3&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe>

    <!-- PS2 Alert Panel -->
    <!--<iframe src="http://10.183.244.87:3000/d-solo/df3y0kbox7t34a/humid?orgId=1&from=1762997664531&to=1762997964531&timezone=browser&refresh=5s&panelId=2&__feature.dashboardSceneSolo=true" width="450" height="200" frameborder="0"></iframe> -->
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
  <footer>
    Powered by <b>Prometheus</b> & <b>Grafana</b> | IoT PS2
  </footer>
</body>
</html>
